name: Build ESP-IDF Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          # 把压缩包解压到当前目录
          unzip xiaozhi-esp32.zip

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1.2 
          target: esp32s3
          # 注意：这里路径指向解压出来的文件夹
          # 如果你的 zip 解压后直接就是文件（没有外层文件夹），改成 path: '.'
          path: 'xiaozhi-esp32' 

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OttoClaw-Firmware
          path: build/*.bin
